<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="新茂報價單">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1a1a1a">
<title>新茂企業 — 晟田科技報價單產生器</title>
<link rel="manifest" href="manifest.json">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif; font-size: 13px; background: #f5f4f0; color: #1a1a1a; min-height: 100vh; -webkit-text-size-adjust: 100%; }
/* iOS: prevent input zoom (font-size >= 16px) */
input, textarea, select { font-size: 16px !important; }
/* Larger tap targets on mobile */
@media (max-width: 768px) {
  .tab { padding: 10px 16px; }
  .btn-primary, .btn-sec { padding: 12px 18px; }
  .del-btn { font-size: 20px; padding: 4px 8px; }
  .items td input { font-size: 16px !important; padding: 8px 6px; }
  .add-row-btn { padding: 12px; }
}
header { background: #fff; border-bottom: 1px solid #e0ddd6; padding: 14px 32px; display: flex; align-items: center; gap: 12px; }
header h1 { font-size: 16px; font-weight: 600; }
header span { font-size: 12px; color: #888; }
.container { max-width: 880px; margin: 0 auto; padding: 28px 16px; }
.tabs { display: flex; border-bottom: 1.5px solid #d6d3cb; margin-bottom: 24px; }
.tab { padding: 9px 22px; font-size: 13px; cursor: pointer; border: none; background: none; color: #888; border-bottom: 2.5px solid transparent; margin-bottom: -1.5px; font-family: inherit; }
.tab.active { color: #1a1a1a; border-bottom-color: #1a1a1a; font-weight: 600; }
.panel { display: none; }
.panel.active { display: block; }
.card { background: #fff; border: 1px solid #e8e5de; border-radius: 10px; padding: 20px 24px; margin-bottom: 16px; }
.card-title { font-size: 10px; font-weight: 700; color: #999; letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 14px; }
.field-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 20px; }
.field { display: flex; flex-direction: column; gap: 4px; }
.field.full { grid-column: 1 / -1; }
.field label { font-size: 11px; color: #777; font-weight: 500; }
.field input, .field select, .field textarea { font-size: 13px; padding: 7px 10px; border: 1px solid #d6d3cb; border-radius: 7px; background: #fafaf8; color: #1a1a1a; width: 100%; font-family: inherit; outline: none; }
.field input:focus, .field select:focus, .field textarea:focus { border-color: #555; }
.badge { display: inline-block; font-size: 10px; padding: 2px 8px; border-radius: 10px; background: #e8f0fe; color: #1a5fb4; font-weight: 600; margin-left: 6px; vertical-align: middle; }
.badge.warn { background: #fff3cd; color: #856404; }
.badge.green { background: #e6f4ea; color: #1e6e42; }
table.items { width: 100%; border-collapse: collapse; table-layout: fixed; }
.items th { font-size: 11px; font-weight: 600; color: #888; padding: 7px 6px; border-bottom: 1.5px solid #e0ddd6; text-align: left; }
.items td { padding: 5px 4px; }
.items td input { font-size: 12px; padding: 5px 7px; border: 1px solid #e0ddd6; border-radius: 6px; background: #fafaf8; color: #1a1a1a; width: 100%; font-family: inherit; outline: none; }
.items td input:focus { border-color: #888; }
.items td input.needs-price { border-color: #f0a020; background: #fffbf0; }
.items td.amt { text-align: right; font-weight: 600; font-size: 13px; padding-right: 10px; }
.del-btn { background: none; border: none; color: #cc4444; cursor: pointer; font-size: 17px; padding: 0 5px; }
.add-row-btn { font-size: 12px; color: #888; background: none; border: 1px dashed #c8c5be; border-radius: 7px; padding: 6px 14px; cursor: pointer; margin-top: 10px; width: 100%; font-family: inherit; }
.add-row-btn:hover { background: #f5f4f0; }
.totals-wrap { margin-top: 16px; border-top: 1px solid #e0ddd6; padding-top: 12px; display: flex; flex-direction: column; align-items: flex-end; gap: 5px; }
.totals-row { display: flex; gap: 48px; font-size: 13px; }
.totals-row .lbl { color: #888; min-width: 44px; text-align: right; }
.totals-row .val { min-width: 80px; text-align: right; font-weight: 500; }
.totals-row.grand { font-size: 15px; font-weight: 700; padding-top: 7px; border-top: 1px solid #d6d3cb; margin-top: 3px; }
.btn-row { display: flex; gap: 10px; margin-top: 16px; }
.btn-primary { background: #1a1a1a; color: #fff; border: none; border-radius: 8px; padding: 9px 20px; font-size: 13px; cursor: pointer; font-family: inherit; font-weight: 600; }
.btn-primary:hover { background: #333; }
.btn-sec { background: #fff; color: #1a1a1a; border: 1px solid #d6d3cb; border-radius: 8px; padding: 9px 16px; font-size: 13px; cursor: pointer; font-family: inherit; }
.btn-sec:hover { background: #f5f4f0; }
.hint { font-size: 11px; color: #aaa; margin-top: 7px; line-height: 1.6; }
.paste-area { width: 100%; min-height: 220px; font-size: 12px; font-family: 'Courier New', monospace; padding: 12px 14px; border: 1px solid #d6d3cb; border-radius: 8px; background: #fafaf8; color: #1a1a1a; resize: vertical; line-height: 1.65; outline: none; }
.paste-area:focus { border-color: #1a1a1a; }

/* Print styles */
@media print {
  @page { size: A4 portrait; margin: 0; }
  * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  body { background: #fff; font-size: 12px; padding: 15mm 18mm 12mm 18mm; }
  header, .tabs, #panel-input, #panel-edit, .no-print { display: none !important; }
  #panel-preview { display: block !important; }
  .container { max-width: 100%; padding: 0; margin: 0; }
  .doc-preview { border: none !important; padding: 0 !important; border-radius: 0 !important; }
  .doc-title { font-size: 18px !important; margin-bottom: 2px !important; }
  .doc-subtitle { font-size: 15px !important; margin-bottom: 8px !important; }
  .vendor-info { font-size: 12px !important; line-height: 1.6 !important; margin-bottom: 8px !important; }
  .preview-table { margin-bottom: 4px !important; }
  .preview-table th { font-size: 12px !important; padding: 3px 4px !important; height: auto !important; }
  .preview-table td { font-size: 12px !important; padding: 2px 4px !important; }
  .preview-note { font-size: 11px !important; margin-top: 6px !important; }
  .stamp-area { margin-top: 0 !important; }
  .stamp-img { width: 28mm !important; height: 28mm !important; }
}

/* Preview styles */
.doc-preview { background: #fff; border: 1px solid #d6d3cb; border-radius: 10px; padding: 32px 40px; font-size: 13px; line-height: 1.55; max-width: 210mm; margin: 0 auto; position: relative; }
.doc-title { font-size: 18px; font-weight: 700; text-align: center; margin-bottom: 2px; }
.doc-subtitle { font-size: 15px; font-weight: 700; text-align: center; margin-bottom: 10px; }
.vendor-info { font-size: 13px; line-height: 1.6; margin-bottom: 10px; }
.vendor-info .date-right { float: right; }
.preview-table { width: 100%; border-collapse: collapse; table-layout: fixed; margin-bottom: 6px; border: 1px solid #333; }
.preview-table th { font-size: 13px; font-weight: 600; text-align: center; padding: 5px 4px; border: 1px solid #333; background: #fff; }
.preview-table td { padding: 3px 5px; text-align: center; border: 1px solid #333; font-size: 13px; vertical-align: middle; }
.preview-table td.left { text-align: left; padding-left: 8px; }
.preview-table td.right { text-align: right; padding-right: 8px; }
.preview-note { font-size: 12px; font-weight: 700; margin-top: 8px; }
.stamp-area { position: relative; text-align: right; margin-top: 0; }
.stamp-img { width: 90px; height: 90px; object-fit: contain; opacity: 0.9; }
</style>
</head>
<body>
<header>
  <h1>新茂企業有限公司</h1>
  <span>晟田科技報價單產生器 — 支援文字貼入 & 手動填寫</span>
</header>
<div class="container">
  <div class="tabs">
    <button class="tab active" id="tab-input">① 輸入來源</button>
    <button class="tab" id="tab-edit">② 確認 / 填價</button>
    <button class="tab" id="tab-preview">③ 預覽 & 列印</button>
  </div>

  <!-- ① 輸入來源 -->
  <div class="panel active" id="panel-input">
    <div class="card">
      <div class="card-title">貼入報價單文字 <span class="badge green">自動帶入含單價</span></div>
      <p class="hint" style="margin-bottom:10px">將 Claude 產出的報價單文字整個複製貼上，系統會自動讀取所有欄位（包含單價與備註），直接到③就能列印含印章版本。</p>
      <textarea class="paste-area" id="quote-paste" placeholder="例如貼入：

報價日期：2026年5月11日
客戶：晟田科技工業股份有限公司
廠商電話：(07)3127535
廠商傳真：(07)3120893

產品明細：
  1. 內六角螺絲 M16*P2.0*200L (SCM435)，32個，單價 70，備註 2-3天
  2. 內六角螺絲 M16*P2.0*140L (SCM435)，32個，單價 40，備註 2-3天

合計：3,695
稅金：185
總計：3,880"></textarea>
      <div class="btn-row">
        <button class="btn-primary" id="btn-parse">解析並帶入 →</button>
        <button class="btn-sec" id="btn-skip">跳過，直接手填</button>
      </div>
    </div>
  </div>

  <!-- ② 確認 / 填價 -->
  <div class="panel" id="panel-edit">
    <div class="card">
      <div class="card-title">廠商 / 客戶資訊</div>
      <div class="field-grid">
        <div class="field"><label>報價日期</label><input type="date" id="e-date"></div>
        <div class="field"><label>客戶名稱</label><input type="text" id="e-company" value="晟田科技工業股份有限公司"></div>
        <div class="field"><label>廠商電話</label><input type="text" id="e-vendor-tel" value="(07)3127535"></div>
        <div class="field"><label>廠商傳真</label><input type="text" id="e-vendor-fax" value="(07)3120893"></div>
      </div>
    </div>
    <div class="card">
      <div class="card-title">產品明細</div>
      <table class="items">
        <thead><tr>
          <th style="width:28px">序</th>
          <th style="width:160px">產品名稱</th>
          <th style="width:200px">產品規格</th>
          <th style="width:62px">數量</th>
          <th style="width:90px">單價</th>
          <th style="width:82px;text-align:right;padding-right:10px">金額</th>
          <th style="width:100px">備註</th>
          <th style="width:26px"></th>
        </tr></thead>
        <tbody id="edit-items-body"></tbody>
      </table>
      <button class="add-row-btn" id="btn-add-row">＋ 新增產品項目</button>
      <div style="display:flex;align-items:flex-start;gap:24px;margin-top:16px;border-top:1px solid #e0ddd6;padding-top:12px;">
        <div style="flex:1;"></div>
        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex-shrink:0;padding-top:4px;">
          <div class="totals-row"><span class="lbl">合計</span><span class="val" id="e-sub">0</span></div>
          <div class="totals-row"><span class="lbl">稅金 5%</span><span class="val" id="e-tax">0</span></div>
          <div class="totals-row grand"><span class="lbl">總計</span><span class="val" id="e-total">0</span></div>
        </div>
      </div>
    </div>
    <div class="btn-row">
      <button class="btn-primary" id="btn-go-preview">預覽報價單（含印章）→</button>
      <button class="btn-sec" id="btn-back-to-input">← 返回</button>
    </div>
  </div>

  <!-- ③ 預覽 & 列印 -->
  <div class="panel" id="panel-preview">
    <div class="doc-preview" id="doc-out"></div>
    <div class="btn-row no-print" style="justify-content:flex-end;margin-top:16px;">
      <button class="btn-sec" id="btn-back-to-edit">← 返回修改</button>
      <button class="btn-primary" id="btn-print">列印 / 儲存 PDF 📄</button>
    </div>
  </div>
</div>

let editRows = [], rowId = 0;

function today() { return new Date().toISOString().split('T')[0]; }

window.addEventListener('DOMContentLoaded', () => {
  // ── 初始化 ──────────────────────────────────────────────
  document.getElementById('e-date').value = today();
  addEditRow('','',1,'個',0,false,'');

  // ── 分頁切換 ────────────────────────────────────────────
  function bindTab(id, target) {
    const el = document.getElementById(id);
    if (el) el.addEventListener('click', () => switchTab(target));
  }
  bindTab('tab-input',        'input');
  bindTab('tab-edit',         'edit');
  bindTab('tab-preview',      'preview');
  bindTab('btn-go-preview',   'preview');
  bindTab('btn-back-to-input','input');
  bindTab('btn-back-to-edit', 'edit');

  // ── 功能按鈕 ────────────────────────────────────────────
  const btnParse = document.getElementById('btn-parse');
  if (btnParse) btnParse.addEventListener('click', parseQuotation);

  const btnSkip = document.getElementById('btn-skip');
  if (btnSkip) btnSkip.addEventListener('click', () => switchTab('edit'));

  const btnAddRow = document.getElementById('btn-add-row');
  if (btnAddRow) btnAddRow.addEventListener('click', () => addEditRow());

  // ── 列印（iOS 相容）──────────────────────────────────────
  const btnPrint = document.getElementById('btn-print');
  if (btnPrint) {
    btnPrint.addEventListener('click', () => {
      const isIOS = /iP(ad|hone|od)/.test(navigator.userAgent) ||
                    (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      if (isIOS) {
        alert('iPad / iPhone 請點上方「分享」圖示 →「列印」(AirPrint) 來儲存 PDF。');
      } else {
        window.print();
      }
    });
  }
});

function switchTab(t) {
  document.querySelectorAll('.tab').forEach((el,i) => {
    el.classList.toggle('active', ['input','edit','preview'][i]===t);
  });
  document.querySelectorAll('.panel').forEach(el => el.classList.remove('active'));
  document.getElementById('panel-'+t).classList.add('active');
  if(t==='preview') buildPreview();
}

function addEditRow(name='',spec='',qty=1,unit='個',price=0,dash=false,note='') {
  rowId++;
  editRows.push({id:rowId, name, spec, qty, unit, price, dash, note});
  renderEditRows();
}

// ── iOS-safe DOM builder (no innerHTML+inline handlers) ──────────────────
function mk(tag, attrs={}, styles={}) {
  const el = document.createElement(tag);
  Object.entries(attrs).forEach(([k,v]) => {
    if (v === null || v === undefined) return;
    if (k === 'cls') el.className = v;
    else if (k === 'txt') el.textContent = v;
    else if (k === 'val') el.value = v;
    else el.setAttribute(k, v);
  });
  Object.entries(styles).forEach(([k,v]) => el.style[k] = v);
  return el;
}

function renderEditRows() {
  const tbody = document.getElementById('edit-items-body');
  // Save focused row id and field before re-render
  const focusedEl = document.activeElement;
  const focusedRowId = focusedEl ? focusedEl.dataset.rowid : null;
  const focusedField = focusedEl ? focusedEl.dataset.field : null;

  tbody.innerHTML = '';
  editRows.forEach((r, i) => {
    const amt = r.dash ? 0 : (r.price * r.qty);
    const tr = document.createElement('tr');

    // No. cell
    const tdNo = document.createElement('td');
    tdNo.style.textAlign = 'center'; tdNo.style.color = '#888';
    tdNo.textContent = i + 1;
    tr.appendChild(tdNo);

    // Name input
    const tdName = document.createElement('td');
    const inName = mk('input', {placeholder:'產品名稱', val:r.name, 'data-rowid':r.id, 'data-field':'name'});
    inName.addEventListener('change', e => { const row=editRows.find(x=>x.id===r.id); if(row){row.name=e.target.value;} calcTotals(); });
    inName.addEventListener('input', e => { const row=editRows.find(x=>x.id===r.id); if(row) row.name=e.target.value; });
    tdName.appendChild(inName); tr.appendChild(tdName);

    // Spec input
    const tdSpec = document.createElement('td');
    const inSpec = mk('input', {placeholder:'規格型號', val:r.spec, 'data-rowid':r.id, 'data-field':'spec'});
    inSpec.addEventListener('change', e => { const row=editRows.find(x=>x.id===r.id); if(row){row.spec=e.target.value;} });
    inSpec.addEventListener('input', e => { const row=editRows.find(x=>x.id===r.id); if(row) row.spec=e.target.value; });
    tdSpec.appendChild(inSpec); tr.appendChild(tdSpec);

    // Qty input
    const tdQty = document.createElement('td');
    const inQty = mk('input', {type:'number', val:r.qty, min:'1', 'data-rowid':r.id, 'data-field':'qty'}, {textAlign:'center'});
    inQty.addEventListener('change', e => { const row=editRows.find(x=>x.id===r.id); if(row){row.qty=+e.target.value||1; calcTotals();} });
    tdQty.appendChild(inQty); tr.appendChild(tdQty);

    // Price + dash button
    const tdPrice = document.createElement('td');
    const priceWrap = mk('div', {}, {display:'flex', gap:'4px', alignItems:'center'});
    const inPrice = mk('input', {
      type:'number', min:'0',
      placeholder: r.dash ? '－' : '請填',
      'data-rowid': r.id, 'data-field': 'price'
    }, {flex:'1', minWidth:'0', opacity: r.dash?'0.3':''});
    if (!r.dash && r.price > 0) inPrice.value = r.price;
    if (!r.dash && !r.price) inPrice.classList.add('needs-price');
    if (r.dash) { inPrice.disabled = true; inPrice.style.borderColor='#d6d3cb'; }
    inPrice.addEventListener('change', e => {
      const row = editRows.find(x=>x.id===r.id);
      if(row){ row.price=+e.target.value; e.target.classList.toggle('needs-price',!+e.target.value); calcTotals(); }
    });

    const btnDash = mk('button', {txt:'－'}, {
      fontSize:'11px', padding:'3px 7px',
      border: '0.5px solid ' + (r.dash?'#888':'#d6d3cb'),
      borderRadius:'4px',
      background: r.dash ? '#e8e5de' : 'none',
      color: r.dash ? '#1a1a1a' : '#aaa',
      cursor:'pointer', flexShrink:'0',
      fontWeight: r.dash ? '600' : '400'
    });
    btnDash.type = 'button';
    btnDash.addEventListener('click', () => {
      const row = editRows.find(x=>x.id===r.id);
      if(row){ row.dash=!row.dash; if(row.dash) row.price=0; renderEditRows(); }
    });
    priceWrap.appendChild(inPrice); priceWrap.appendChild(btnDash);
    tdPrice.appendChild(priceWrap); tr.appendChild(tdPrice);

    // Amount cell
    const tdAmt = mk('td', {cls:'amt'}, {color: r.dash?'#aaa':''});
    tdAmt.textContent = r.dash ? '－' : (amt ? amt.toLocaleString() : '—');
    tr.appendChild(tdAmt);

    // Note input
    const tdNote = document.createElement('td');
    const inNote = mk('input', {placeholder:'備註', val:r.note, 'data-rowid':r.id, 'data-field':'note'}, {minWidth:'80px'});
    inNote.addEventListener('change', e => { const row=editRows.find(x=>x.id===r.id); if(row) row.note=e.target.value; });
    inNote.addEventListener('input', e => { const row=editRows.find(x=>x.id===r.id); if(row) row.note=e.target.value; });
    tdNote.appendChild(inNote); tr.appendChild(tdNote);

    // Delete button
    const tdDel = document.createElement('td');
    const btnDel = mk('button', {cls:'del-btn', txt:'×'});
    btnDel.type = 'button';
    btnDel.addEventListener('click', () => { editRows = editRows.filter(x=>x.id!==r.id); renderEditRows(); });
    tdDel.appendChild(btnDel); tr.appendChild(tdDel);

    tbody.appendChild(tr);
  });

  // Restore focus if same field still exists
  if (focusedRowId && focusedField) {
    const el = tbody.querySelector(`[data-rowid="${focusedRowId}"][data-field="${focusedField}"]`);
    if (el) el.focus();
  }

  calcTotals();
}

function toggleDash(id) { const r = editRows.find(r=>r.id===id); if(r){ r.dash=!r.dash; if(r.dash)r.price=0; renderEditRows(); } }
function delRow(id) { editRows = editRows.filter(r=>r.id!==id); renderEditRows(); }

function calcTotals() {
  const allDone = editRows.every(r => r.dash || r.price > 0);
  const priced = editRows.filter(r => !r.dash && r.price > 0);
  const sub = priced.reduce((s,r)=>s+r.qty*r.price, 0);
  const tax = Math.round(sub*0.05);
  document.getElementById('e-sub').textContent   = allDone ? sub.toLocaleString() : '—';
  document.getElementById('e-tax').textContent   = allDone ? tax.toLocaleString() : '—';
  document.getElementById('e-total').textContent = allDone ? (sub+tax).toLocaleString() : '—';
}

function fmtDate(d) {
  if(!d) return '';
  const [y,mo,dd] = d.split('-');
  return `${y}年${parseInt(mo)}月${parseInt(dd)}日`;
}

function parseQuotation() {
  const raw = document.getElementById('quote-paste').value.trim();
  if(!raw) { alert('請先貼入報價單文字'); return; }

  // Parse date
  const dateM = raw.match(/報價日期[：:]\s*(\d{4})年(\d{1,2})月(\d{1,2})日/);
  if(dateM) {
    document.getElementById('e-date').value = `${dateM[1]}-${dateM[2].padStart(2,'0')}-${dateM[3].padStart(2,'0')}`;
  }

  // Parse company
  const compM = raw.match(/客戶[：:]\s*(.+)/);
  if(compM) document.getElementById('e-company').value = compM[1].trim();

  // Parse vendor tel/fax
  const telM = raw.match(/廠商電話[：:]\s*(.+)/);
  if(telM) document.getElementById('e-vendor-tel').value = telM[1].trim();
  const faxM = raw.match(/廠商傳真[：:]\s*(.+)/);
  if(faxM) document.getElementById('e-vendor-fax').value = faxM[1].trim();

  // Parse items
  editRows = [];
  rowId = 0;
  // Pattern: N. 品名 規格，數量單位，單價 XX，備註 XX  or  金額 XX
  const itemRe = /^\s*(\d+)\.\s+(.+?)，(\d+)([\u4e00-\u9fff]+)，單價\s+([\d,.]+|－)(?:，金額\s+[\d,.－]+)?(?:，備註\s+(.*))?$/gm;
  let m;
  while((m = itemRe.exec(raw)) !== null) {
    rowId++;
    const fullName = m[2].trim();
    // Try to split name and spec: look for first space-separated segment that looks like a spec
    let name = fullName, spec = '';
    const spIdx = fullName.indexOf(' ');
    if(spIdx > 0) {
      name = fullName.substring(0, spIdx);
      spec = fullName.substring(spIdx+1);
    }
    const priceVal = m[5] === '－' ? 0 : parseFloat(m[5].replace(/,/g,''));
    editRows.push({
      id: rowId,
      name: name,
      spec: spec,
      qty: parseInt(m[3]),
      unit: m[4],
      price: priceVal,
      dash: m[5] === '－',
      note: m[6] ? m[6].trim() : ''
    });
  }

  if(editRows.length === 0) {
    // Try alternative format: "N. 品名 規格，數量單位，單價 XX，金額 XX"
    const itemRe2 = /^\s*(\d+)\.\s+(.+?)，(\d+)([\u4e00-\u9fff]+)，單價\s+([\d,.]+|－)/gm;
    while((m = itemRe2.exec(raw)) !== null) {
      rowId++;
      const fullName = m[2].trim();
      let name = fullName, spec = '';
      const spIdx = fullName.indexOf(' ');
      if(spIdx > 0) {
        name = fullName.substring(0, spIdx);
        spec = fullName.substring(spIdx+1);
      }
      const priceVal = m[5] === '－' ? 0 : parseFloat(m[5].replace(/,/g,''));
      editRows.push({
        id: rowId, name, spec,
        qty: parseInt(m[3]),
        unit: m[4],
        price: priceVal,
        dash: m[5] === '－',
        note: ''
      });
    }
  }

  if(editRows.length === 0) {
    alert('無法解析品項資料，請確認格式是否正確。');
    return;
  }

  renderEditRows();
  switchTab('edit');
}

function buildPreview() {
  const dateStr = fmtDate(document.getElementById('e-date').value);
  const company = document.getElementById('e-company').value;
  const vendorTel = document.getElementById('e-vendor-tel').value;
  const vendorFax = document.getElementById('e-vendor-fax').value;

  const priced = editRows.filter(r => !r.dash && r.price > 0);
  const sub  = priced.reduce((s,r)=>s+r.qty*r.price, 0);
  const tax  = Math.round(sub*0.05);

  // Build 10 rows by default (or more if items > 10)
  const totalRows = Math.max(10, editRows.length);

  // A4 = 297mm, margins top 15mm + bottom 12mm = 27mm → usable = 270mm
  // Title ~14mm, subtitle ~10mm, vendor info ~18mm, table header ~9mm, note+stamp ~16mm
  // Available for data rows = 270 - 14 - 10 - 18 - 9 - 16 = 203mm → use 195mm to be safe
  const availableMm = 195;
  const rowHeightMm = Math.min(16, Math.floor((availableMm / totalRows) * 10) / 10);

  let rowsHtml = '';
  for(let i = 0; i < totalRows; i++) {
    if(i < editRows.length) {
      const r = editRows[i];
      const priceStr = r.dash ? '－' : (r.price ? r.price.toLocaleString() : '');
      const amtVal = r.dash ? 0 : (r.qty * r.price);
      const amtStr = r.dash ? '－' : (amtVal ? amtVal.toLocaleString() : '');
      rowsHtml += `<tr>
        <td>${i+1}</td>
        <td class="left">${r.name}</td>
        <td>${r.spec}</td>
        <td class="right">${r.qty}${r.unit||'個'}</td>
        <td class="right">${priceStr}</td>
        <td>${r.note||''}</td>
      </tr>`;
    } else {
      rowsHtml += `<tr>
        <td>${i+1}</td>
        <td></td><td></td><td></td><td></td><td></td>
      </tr>`;
    }
  }

  document.getElementById('doc-out').innerHTML = `
    <style>
      #doc-out .preview-table td { height: ${rowHeightMm}mm; }
      @media print {
        #doc-out .preview-table td { height: ${rowHeightMm}mm !important; }
        #doc-out .bottom-row { page-break-inside: avoid; }
      }
    </style>
    <div class="doc-title">晟田科技工業股份有限公司</div>
    <div class="doc-subtitle">產品詢價單</div>
    <div class="vendor-info">
      廠商名稱：新茂企業有限公司<br>
      廠商電話：${vendorTel}<br>
      廠商傳真：${vendorFax}<span class="date-right">日期：${dateStr}</span>
    </div>
    <table class="preview-table">
      <thead><tr>
        <th style="width:8%">NO</th>
        <th style="width:22%">產品名稱</th>
        <th style="width:28%">產品規格</th>
        <th style="width:12%">數量</th>
        <th style="width:13%">單價</th>
        <th style="width:17%">備註</th>
      </tr></thead>
      <tbody>${rowsHtml}</tbody>
    </table>
    <div class="bottom-row" style="display:flex;align-items:center;justify-content:space-between;margin-top:4px;">
      <div class="preview-note" style="flex:1;">備註：若產品規格與上述所列的不一樣，請務必詳細填寫，謝謝。</div>
      <div style="flex-shrink:0;margin-left:16px;">
        <img class="stamp-img" src="${STAMP_SRC}" alt="公司印章">
      </div>
    </div>
  `;
}
</script>
